services:
  portal:
    image: emby-search:local
    build:
      context: .
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      PORTAL_DATA_DIR: /data
    ports:
      - "${PORTAL_BIND_ADDRESS:-127.0.0.1}:${PORTAL_PORT:-8000}:8000"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "10001:10001"
    mem_limit: 512m
    pids_limit: 100
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
